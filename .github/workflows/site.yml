name: Site

# The tunables.dev site is generated from this repository: its own pages in
# site/, plus docs/ and CHANGELOG.md, and the version in package.json.
#
# Branch protection requires the `site` check, and a workflow skipped by a
# path filter never reports one, which would leave every unrelated pull
# request waiting forever. So the workflow always runs, `changes` decides
# whether the change can affect the site, and `site` passes when nothing
# that ran failed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  changes:
    if: github.repository == 'itai-gendler/tunables'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Decide whether the site is affected
        working-directory: .
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual run, a first push, or a base Git cannot find builds everything.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths='^(site/|docs/|CHANGELOG\.md$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/site\.yml$)'
          if git diff --name-only "$BASE...$GITHUB_SHA" | grep -q -E "$paths"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the site renders changed; skipping the build and tests."
          fi

  # Static checks and unit tests, beside the build rather than ahead of it:
  # neither the preview nor the e2e tests wait for them.
  static:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the exact pnpm pinned by package.json's packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm editorconfig
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:integration

  # The build. Its output is what the e2e job tests and what both deploy jobs
  # publish, so nothing is built twice.
  build:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Upload the generated site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/.output/public
          retention-days: 7

  # End-to-end tests against the built site, in Playwright's own image so no
  # browser is downloaded, split across two runners. Keep the image tag equal
  # to @playwright/test.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/.output/public
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        env:
          CI: true
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: site/playwright-report
          retention-days: 7

  # A pull request from this repository deploys its build to its own
  # Cloudflare Pages preview URL as soon as the build passes, while the e2e
  # tests still run: a preview helps most when something is wrong. Forks have
  # no credentials.
  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/.output/public
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: deploy
        name: Deploy to Cloudflare Pages
        working-directory: .
        shell: bash
        run: |
          # A pull request without access to secrets skips the preview;
          # production still requires them.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the preview deploy."
            exit 0
          fi
          npx --yes wrangler@4.149.0 pages deploy site/.output/public \
            --project-name=tunables \
            --branch="$BRANCH" \
            --commit-hash="$COMMIT" | tee deploy.log
          echo "url=$(grep -o 'https://[^ ]*pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
          COMMIT: ${{ github.event.pull_request.head.sha }}

  # main deploys to tunables.dev only once the checks, the build and the e2e
  # tests pass.
  production:
    needs: [static, build, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://tunables.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/.output/public
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy to Cloudflare Pages
        working-directory: .
        run: |
          npx --yes wrangler@4.149.0 pages deploy site/.output/public \
            --project-name=tunables \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The check branch protection requires. Skipped jobs pass; anything that
  # ran and did not succeed fails it. It runs only in itai-gendler/tunables,
  # like everything above, so a fork's copy of the workflow does nothing.
  site:
    needs: [changes, static, build, e2e]
    if: always() && github.repository == 'itai-gendler/tunables'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every site job that ran to pass
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A site job did not pass: $RESULTS"; exit 1 ;;
            esac
          done

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its running check; main keeps every run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs the exact pnpm pinned by package.json's packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # A lockfile that no longer matches package.json fails here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # The fixture is news as tunables holds it; its facts and defaults must
      # agree with news's own Product Model.
      - run: node dist/cli.js --cwd test/fixtures/news check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tunables
          POSTGRES_PASSWORD: tunables
          POSTGRES_DB: tunables
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tunables"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TUNABLES_TEST_DATABASE_URL: postgres://tunables:tunables@localhost:5434/tunables
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:consumer

  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir playground screenshots
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: screens-report
          path: playground/playwright-report
